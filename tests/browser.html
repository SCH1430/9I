<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОГЭ — проверки интерфейса</title><link rel="icon" href="../favicon.svg"><style>body{font:15px system-ui;margin:24px;color:#243b58}button{padding:12px 20px}li{margin:12px 0}iframe{width:100%;height:650px;border:1px solid #ccd;margin-top:24px}</style></head><body><h1>Проверки ОГЭ 1–10</h1><p>Изолированные данные. Основная работа не изменяется. Fullscreen и Web Locks здесь заменены тестовыми реализациями.</p><button id="run">Запустить проверки</button><p id="status" role="status">Готово к запуску</p><ol id="checks"></ol><iframe id="fixture" title="Тестовый тренажёр"></iframe><script src="../js/tasks.js"></script><script src="../js/core.js"></script><script>
const frame=document.querySelector('#fixture'),assert=(v,m)=>{if(!v)throw Error(m);},pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<200;i++){if(fn())return;await pause(25);}throw Error('Истекло ожидание');}
const example=(overrides={},ago=0)=>OgeCore.createSession({firstName:'Тест',lastName:'Ученик',className:'9 А'},{...OgeCore.DEFAULT,...overrides},42,crypto.randomUUID(),Date.now()-ago);
async function mount(state=null,options={}){
 let html=await(await fetch('../'+(options.teacher?'teacher.html':'index.html'))).text();const base=new URL('../',location.href).href;
 const boot=`<base href="${base}"><script>
 const realAdd=window.addEventListener.bind(window);window.addEventListener=(type,...args)=>{if(type!=='beforeunload')realAdd(type,...args);};
 window.fixtureConfig=${JSON.stringify(state?.config||{...OgeCore.DEFAULT,...options.config})};
 let saved=${JSON.stringify(state?JSON.stringify(state):null)}, full=false;
 Object.defineProperty(window,'localStorage',{value:{getItem:()=>{${options.blocked?"throw Error('denied')":'return saved'}},setItem:(k,v)=>{${options.blocked?"throw Error('denied')":"if(!k.endsWith(':probe'))saved=v;"}},removeItem:()=>{}}});
 window.readState=()=>saved?JSON.parse(saved):null;
 Object.defineProperty(navigator,'locks',{value:{request:(_,options,fn)=>Promise.resolve(fn(${options.duplicate?'null':'{}'}))}});
 Object.defineProperty(document,'fullscreenEnabled',{value:${options.unsupported?'false':'true'}});
 Object.defineProperty(document,'fullscreenElement',{get:()=>full?document.documentElement:null});
 Object.defineProperty(document,'hasFocus',{value:()=>true});
 document.documentElement.requestFullscreen=async()=>{${options.denied?"throw Error('Fullscreen denied');":"full=true;document.dispatchEvent(new Event('fullscreenchange'));"}};
 document.exitFullscreen=async()=>{full=false;document.dispatchEvent(new Event('fullscreenchange'));};
 URL.createObjectURL=blob=>{window.testBlob=blob;return 'blob:report'};URL.revokeObjectURL=()=>{};HTMLAnchorElement.prototype.click=function(){window.testFilename=this.download};
 <\/script>`;
 html=html.replace('<head>','<head>'+boot).replace('<script defer src="./js/app.js">','<script defer src="./tests/fixture.js"></'+'script><script defer src="./js/app.js">');
 frame.srcdoc=html;await new Promise(r=>frame.addEventListener('load',r,{once:true}));await pause(30);return {doc:frame.contentDocument,win:frame.contentWindow};
}
async function dismissGate(doc){if(!doc.querySelector('#control-overlay').hidden){doc.querySelector('#return-button').click();await until(()=>doc.querySelector('#control-overlay').hidden);}}
function answer(doc,value){const el=doc.querySelector('#answer-input');el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));}
const tests=[
 ['Все 10 тем: ответы, таблицы, граф, итог 5, JSON и печать',async()=>{const s=example(),qs=OgeTasks.generateQuestions(10,42),{doc,win}=await mount(s);await dismissGate(doc);for(let i=0;i<qs.length;i++){assert(doc.querySelector('#question-title').textContent===qs[i].title,'Не то задание');answer(doc,qs[i].answer);doc.querySelector('#next-button').click();}doc.querySelector('[data-action="1"]').click();await until(()=>doc.querySelector('.grade-circle'));assert(doc.querySelector('.grade-circle strong').textContent==='5','Не все ответы зачтены');assert(doc.querySelectorAll('.review-item').length===10,'Нет разбора');doc.querySelector('#json-report').click();const report=OgeCore.readReport(JSON.parse(await win.testBlob.text()));assert(report.summary.correct===10,'JSON не содержит результата');assert(report.session.edits.every(n=>n>=1),'Не записаны изменения ответов');win.dispatchEvent(new Event('beforeprint'));assert(doc.querySelectorAll('.review-item[open]').length===10,'Разбор не раскрыт для печати');}],
 ['Строгий режим: вставка запрещена, уход объединяется, выход закрывает задания',async()=>{const {doc,win}=await mount(example());await dismissGate(doc);const input=doc.querySelector('#answer-input'),paste=new Event('paste',{bubbles:true,cancelable:true});input.dispatchEvent(paste);assert(paste.defaultPrevented,'Вставка не блокируется');win.dispatchEvent(new Event('blur'));Object.defineProperty(doc,'hidden',{configurable:true,value:true});doc.dispatchEvent(new Event('visibilitychange'));assert(!doc.querySelector('#control-overlay').hidden,'Нет блокировки');assert(doc.querySelector('#main').inert,'Задания доступны за блокировкой');assert(win.readState().events.filter(e=>e.type==='away').length===1,'Двойной учёт ухода');Object.defineProperty(doc,'hidden',{configurable:true,value:false});await dismissGate(doc);await doc.exitFullscreen();assert(!doc.querySelector('#control-overlay').hidden,'Выход не заблокировал задания');assert(win.readState().events.some(e=>e.type==='fullscreen-exit'),'Нет события выхода');await dismissGate(doc);assert(!doc.querySelector('#main').inert,'Задания не разблокировались');}],
 ['Восстановление сохраняет ответ, срок и время закрытой страницы',async()=>{let s=example({},5000);s.lastSeenAt=Date.now()-5000;s.answers[0]='123';s.flags[0]=true;const {doc,win}=await mount(s);assert(doc.querySelector('#answer-input').value==='123','Потерян ответ');assert(win.readState().deadline===s.deadline,'Таймер сброшен');assert(win.readState().awayMs>=4000,'Не записано время между загрузками');assert(!doc.querySelector('#control-overlay').hidden,'Нет подтверждения восстановления');}],
 ['Истечение времени во время блокировки автоматически завершает работу',async()=>{const s=example({},45*60000-900);s.lastSeenAt=Date.now();s.answers=OgeTasks.generateQuestions(10,42).map(q=>q.answer);const {doc,win}=await mount(s);await until(()=>doc.querySelector('.grade-circle'));assert(doc.querySelector('.grade-circle strong').textContent==='5','Не выставлена оценка');assert(win.readState().finishReason==='timeout','Неправильная причина');assert(doc.querySelector('#control-overlay').hidden,'Блокировка не закрылась');}],
 ['Строгий старт: нет Fullscreen, хранилища или свободной вкладки — начало запрещено',async()=>{for(const options of [{unsupported:true},{blocked:true},{duplicate:true}]){const {doc}=await mount(null,options);assert(doc.querySelector('#start-button').disabled,'Начало не заблокировано');assert(!doc.querySelector('#form-error').hidden,'Нет причины');}}],
 ['Код учителя закрывает разбор и открывает его после проверки',async()=>{const key='TEACHER-KEY',s=example({id:'lesson-test',reviewHash:await OgeCore.hash(key)});s.answers=OgeTasks.generateQuestions(10,42).map(q=>q.answer);const {doc}=await mount(s);await dismissGate(doc);doc.querySelector('#finish-button').click();doc.querySelector('[data-action="1"]').click();assert(doc.querySelector('#unlock-form'),'Нет кода разбора');assert(doc.querySelectorAll('.review-item').length===0,'Ответы открыты заранее');doc.querySelector('#review-code').value='wrong';doc.querySelector('#unlock-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>doc.querySelector('#unlock-error').textContent);doc.querySelector('#review-code').value=key;doc.querySelector('#unlock-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>doc.querySelectorAll('.review-item').length===10);assert(!doc.querySelector('#new-session'),'Ссылка учителя разрешает новую попытку');}],
 ['Учитель: ссылка, закрытый разбор, импорт отчёта, пересчёт и CSV',async()=>{const {doc,win}=await mount(null,{teacher:true});doc.querySelector('#settings-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>doc.querySelector('#work-link'));const url=new URL(doc.querySelector('#work-link').value),config=OgeCore.decodeConfig(new URLSearchParams(url.hash.slice(1)).get('work'));assert(config.count===10&&config.strict&&config.reviewHash,'Некорректная ссылка');assert(!url.href.includes(doc.querySelector('#review-key').textContent),'Код попал в ссылку');const s=example(config);s.answers=OgeTasks.generateQuestions(10,42).map(q=>q.answer);OgeCore.finish(s,'manual',Date.now());const r=OgeCore.report(s);r.summary.grade=1;const f=new win.File([JSON.stringify(r)],'result.json',{type:'application/json'}),transfer=new win.DataTransfer();transfer.items.add(f);doc.querySelector('#report-files').files=transfer.files;doc.querySelector('#report-files').dispatchEvent(new Event('change'));await until(()=>doc.querySelector('[data-report]'));assert(doc.querySelector('#report-rows').textContent.includes('10/10'),'Баллы не пересчитаны');doc.querySelector('[data-report]').click();assert(doc.querySelectorAll('#teacher-detail .review-item').length===10,'Нет разбора у учителя');doc.querySelector('#export-csv').click();assert((await win.testBlob.text()).includes('ОГЭ 10'),'Неполная сводка CSV');}],
 ['Обычный режим работает без Fullscreen и без хранилища с предупреждением',async()=>{const {doc}=await mount(null,{config:{strict:false},unsupported:true,blocked:true});doc.querySelector('#first-name').value='Тест';doc.querySelector('#last-name').value='Проверка';doc.querySelector('#class-name').value='9 А';doc.querySelector('#rules-agreement').checked=true;doc.querySelector('#start-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>!doc.querySelector('#exam-screen').hidden);assert(doc.querySelector('#save-status').textContent.includes('недоступно'),'Нет сообщения о сохранении');doc.querySelector('#finish-button').click();doc.querySelector('[data-action="1"]').click();assert(doc.querySelector('.grade-circle strong').textContent==='1','Пустой тест');}],
];
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;document.querySelector('#checks').innerHTML='';let passed=0;document.querySelector('#status').textContent='Выполняются проверки…';for(const [title,run]of tests){const li=document.createElement('li');document.querySelector('#checks').append(li);try{await run();li.textContent='✓ '+title;passed++;}catch(e){li.textContent='✗ '+title+': '+e.message;li.style.color='#a33';}}document.querySelector('#status').textContent=`Пройдено: ${passed} из ${tests.length}`;button.disabled=false;};
</script></body></html>
